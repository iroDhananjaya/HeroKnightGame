<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title></title>
  <link rel="stylesheet" href="..\CSSFiles\csc1142_paper2.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>
  <form>
    <div>
      <div class="heading"><h3>Answer All Questions</h3></div>
      <div class="entire-content" data-aos="zoom-in">
        <label class="question">1.Which of the following artifacts is typically produced during the system analysis phase of the SDLC?</label>
        <div class="ans-container">
          <div class="ans1"><label><input type="radio" name="q1" required>Source code implementation and unit test scripts</label></div>
          <div class="ans2"><label><input type="radio" name="q1">System architectural design and hardware specifications</label></div>
          <div class="ans3"><label><input type="radio" name="q1">System Requirements Specification (SRS) and functional models</label></div>
          <div class="ans4"><label><input type="radio" name="q1">Final deployment manuals and user training schedules</label></div>
          <br>
        </div>
      </div>
    </div>

    <br><br><br>
    <div>
      <div class="entire-content" data-aos="zoom-in">
        <label class="question">2.What is the primary function of a systems analyst within an enterprise software project?</label>
        <div class="ans-container">
          <div class="ans1"><label><input type="radio" name="q2" required>Writing core backend code and configuring servers</label></div>
          <div class="ans2"><label><input type="radio" name="q2">Bridging the communication gap between business stakeholders and technical developers</label></div>
          <div class="ans3"><label><input type="radio" name="q2">Managing corporate budgets and financial portfolios</label></div>
          <div class="ans4"><label><input type="radio" name="q2">Performing network security audits and penetration testing</label></div>
          <br>
        </div>
      </div>
    </div>

    <br><br><br>
    <div>
      <div class="entire-content" data-aos="zoom-in">
        <label class="question">3.In project management, a Work Breakdown Structure (WBS) is best defined as:</label>
        <div class="ans-container">
          <div class="ans1"><label><input type="radio" name="q3" required>A critical path schedule showing task dependencies over time</label></div>
          <div class="ans2"><label><input type="radio" name="q3">A hierarchical decomposition of the total scope of work to be carried out by the project team</label></div>
          <div class="ans3"><label><input type="radio" name="q3">A graphical network diagram used exclusively for calculating probabilistic completion dates</label></div>
          <div class="ans4"><label><input type="radio" name="q3">A matrix mapping resource allocation to financial expenditures</label></div>
          <br>
        </div>
      </div>
    </div>

    <br><br><br>
    <div>
      <div class="entire-content" data-aos="zoom-in">
        <label class="question">4.Which systems development approach emphasizes iterative delivery, active user feedback, and rapid prototyping using specialized tools to shorten the development cycle?</label>
        <div class="ans-container">
          <div class="ans1"><label><input type="radio" name="q4" required>Traditional waterfall approach</label></div>
          <div class="ans2"><label><input type="radio" name="q4">Rapid Application Development (RAD)</label></div>
          <div class="ans3"><label><input type="radio" name="q4">Centralized mainframe batch processing</label></div>
          <div class="ans4"><label><input type="radio" name="q4">Strict linear structured analysis</label></div>
          <br>
        </div>
      </div>
    </div>

    <br><br><br>
    <div>
      <div class="entire-content" data-aos="zoom-in">
        <label class="question">5.When a systems analyst reviews operational manuals, past business reports, and corporate policy documents to understand the official rules of an existing system, which fact-finding technique is being utilized?</label>
        <div class="ans-container">
          <div class="ans1"><label><input type="radio" name="q5" required>Interviewing</label></div>
          <div class="ans2"><label><input type="radio" name="q5">Observation</label></div>
          <div class="ans3"><label><input type="radio" name="q5">Document review / Record sampling</label></div>
          <div class="ans4"><label><input type="radio" name="q5"> Questionnaire design</label></div>
          <br>
        </div>
      </div>
    </div>

    <br><br><br>
    <div>
      <div class="entire-content" data-aos="zoom-in">
        <label class="question">6.In project management, a Work Breakdown Structure (WBS) is best defined as:</label>
        <div class="ans-container">
          <div class="ans1"><label><input type="radio" name="q6" required>A critical path schedule showing task dependencies over time</label></div>
          <div class="ans2"><label><input type="radio" name="q6">A hierarchical decomposition of the total scope of work to be carried out by the project team</label></div>
          <div class="ans3"><label><input type="radio" name="q6">A graphical network diagram used exclusively for calculating probabilistic completion dates</label></div>
          <div class="ans4"><label><input type="radio" name="q6">A matrix mapping resource allocation to financial expenditures</label></div>
          <br>
        </div>
      </div>
    </div>

    <br><br><br>
    <div>
      <div class="entire-content" data-aos="zoom-in">
        <label class="question">7.In the context of system stakeholders, who is primarily responsible for sponsoring the project, providing financial resources, and ensuring the system meets broad organizational goals?</label>
        <div class="ans-container">
          <div class="ans1"><label><input type="radio" name="q7" required>Systems analyst</label></div>
          <div class="ans2"><label><input type="radio" name="q7">System owner</label></div>
          <div class="ans3"><label><input type="radio" name="q7">Programmer</label></div>
          <div class="ans4"><label><input type="radio" name="q7">End user</label></div>
          <br>
        </div>
      </div>
    </div>

    <br><br><br>
    <div>
      <div class="entire-content" data-aos="zoom-in">
        <label class="question">8.Why is it critically important to align business goals with Information Technology (IT) strategies in a modern enterprise?</label>
        <div class="ans-container">
          <div class="ans1"><label><input type="radio" name="q8" required>To ensure that IT investments directly support organizational objectives and create operational value</label></div>
          <div class="ans2"><label><input type="radio" name="q8">To eliminate the need for project managers and systems analysts entirely</label></div>
          <div class="ans3"><label><input type="radio" name="q8">To restrict software development exclusively to traditional waterfall methodologies</label></div>
          <div class="ans4"><label><input type="radio" name="q8">To prevent users from ever interacting directly with hardware infrastructure</label></div>
          <br>
        </div>
      </div>
    </div>

    <br><br><br>
    <div>
      <div class="entire-content" data-aos="zoom-in">
        <label class="question">9.Which phase of the Software Development Life Cycle (SDLC) is primarily concerned with determining the exact technical architecture, database schemas, and interface layout?</label>
        <div class="ans-container">
          <div class="ans1"><label><input type="radio" name="q9" required>Planning phase</label></div>
          <div class="ans2"><label><input type="radio" name="q9">Analysis phase</label></div>
          <div class="ans3"><label><input type="radio" name="q9">Design phase</label></div>
          <div class="ans4"><label><input type="radio" name="q9">Implementation phase</label></div>
          <br>
        </div>
      </div>
    </div>


    <br><br><br>
    <div>
      <div class="entire-content" data-aos="zoom-in">
        <label class="question">10.Which fact-finding technique involves bringing together key users, managers, and systems analysts in a structured, intensive workshop setting to collectively define requirements and resolve conflicts?</label>
        <div class="ans-container">
          <div class="ans1"><label><input type="radio" name="q10" required>Document sampling and record analysis</label></div>
          <div class="ans2"><label><input type="radio" name="q10">JAD</label></div>
          <div class="ans3"><label><input type="radio" name="q10">Passive naturalistic observation</label></div>
          <div class="ans4"><label><input type="radio" name="q10">Unstructured individual questionnaires</label></div>
          <br>
        </div>
      </div>
    </div>

    <br><br><br>
    
    <div class="end-container">
      <button class="sub-btn" type="submit">Submit Answers</button>
      <button class="reset-btn" type="reset">Reset Options</button>
    </div>

    <br><br><br>

  </form>
  
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="..\JSFiles\cs1142_paper2.js"></script>
</body>
</html>
