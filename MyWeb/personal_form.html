<!DOCTYPE html>
<html>
    <head>
        <title>Personal Details Form</title>
        <link rel="stylesheet" href="personal_form.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <h1>Personal Details Form</h1><br><br>

        <div id="clock_container">
            <div id="clock">
                00:00:00
            </div>
        </div>
        <form>
        <fieldset>
            <label name="fullName" id="fullName" >Full Name:</label>
            <input type="text" name="full_name" id="full_name" placeholder="Enter your full name"><br><br>

            <label name="dob" id="dob"> Date of Birth:</label>
            <input type="date" name="DOB" id="DOB"><br><br>

            <label  name="age" id="age">Age:</label>
            <input type="number" name="age" id="age"><br><br>
        
            <label name="email_label" id="email_label">Email:</label>
            <input type="email" name="Email" id="Email"><br><br>

            <label name="phoneNumber" id="phoneNumber">Phone Number:</label>
            <input type="number" name="Number" id="Number"><br><br>

            <label name="gender" id="gender">Gender:</label>
            <select name="gender_dropdown" id="gender_dropdown">
                <option selected >Select Gender</option>
                <option id="male">Male</option>
                <option id="female">Female</option>
                
            </select>
            <br><br>
              
            <label name="address" id="address">Address:</label>
            <input type="text" name="address" id="address" placeholder="Enter your address"><br><br>

            <button type="button" id="name_button" name="name_button">Submit</button>
        </fieldset>

        </form>
        
    </body>
</html>
