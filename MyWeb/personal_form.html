<!DOCTYPE html>
<html>
    <head>
        <title>Personal Details Form</title>
        <link rel="stylesheet" href="personal_form.css">
    </head>
    <body>
        <h1>Personal Details Form</h1> 
        <form>
        <fieldset>
            <label name="fullName" id="fullName" >Full Name:</label>
            <input type="text" name="full_name" id="full_name" placeholder="Enter your full name"><br><br>

            <label name="dob" id="dob"> Date of Birth:</label>
            <input type="date" name="DOB" id="DOB"><br><br>

            <label  name="a_ge" id="a_ge">Age:</label>
            <input type="number" name="age" id="age"><br><br>
        
            <label name="e_mail" id="e_mail">Email:</label>
            <input type="email" name="Email" id="Email"><br><br>

            <label name="phoneNumber" id="phoneNumber">Phone Number:</label>
            <input type="number" name="Number" id="Number"><br><br>

            <label name="a_ddress" id="a_ddress">Address:</label>
            <input type="text" name="address" id="address" placeholder="Enter your address"><br><br>
        </fieldset>
        
        </form>
    </body>
</html>
