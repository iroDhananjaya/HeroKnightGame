<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Personal Details Form</title>
        <link rel="stylesheet" href="../CSSFiles/personal_form.css">
        <script src="../JSFiles/script.js" defer></script>
    </head>
    <body>
        <h1>Personal Details Form</h1><br><br>

        <div id="clock_container">
            <div id="clock">
                00:00:00
            </div>
        </div>
        <form action="../PhpFiles/personal_details.php" method="POST">
        <fieldset>
            <label name="fullName" id="fullName" >Full Name:</label>
            <input type="text" name="full_name" id="full_name" placeholder="Enter your full name" required><br><br>

            <label name="dob" id="dob"> Date of Birth:</label>
            <input type="date" name="DOB" id="DOB" required><br><br>

            <label  name="age" id="age">Age:</label>
            <input type="number" name="age" id="age" min="0" max="130" required><br><br>
        
            <label name="email_label" id="email_label">Email:</label>
            <input type="email" name="Email" id="Email" required><br><br>

            <label name="phoneNumber" id="phoneNumber">Phone Number:</label>
            <input type="tel" name="Number" id="Number" required><br><br>

            <label name="gender" id="gender">Gender:</label>
            <select name="gender_dropdown" id="gender_dropdown" required>
                <option value="" selected disabled>Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                
            </select>
            <br><br>
              
            <label name="address" id="address">Address:</label>
            <input type="text" name="address" id="address" placeholder="Enter your address" required><br><br>

            <button type="submit" id="name_button" name="name_button">Submit</button>
        </fieldset>

        </form>
        
    </body>
</html>
