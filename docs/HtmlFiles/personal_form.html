<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Personal Details Form</title>
        <link rel="stylesheet" href="../CSSFiles/personal_form.css">
        <script src="../JSFiles/script.js" defer></script>
    </head>
    <body>
        <h1>Personal Details Form</h1><br><br>

        <div id="clock_container">
            <div id="clock">
                00:00:00
            </div>
        </div>
        <form action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="22441f3a-fd2d-42ed-b2ea-5f3250b8e129">
        <fieldset>
            <label name="fullName" id="fullName" >Full Name:</label>
            <input type="text" name="full_name" id="full_name" placeholder="Enter your full name" required><br><br>

            <label name="dob" id="dob" for="DOB">Date of Birth:</label>
            <input type="date" name="DOB" id="DOB" title="Date of Birth" required><br><br>

            <label name="age_label" id="age_label" for="age">Age:</label>
            <input type="number" name="age" id="age" min="0" max="130" placeholder="Enter your age" title="Enter your age" required><br><br>
        
            <label name="email_label" id="email_label" for="Email">Email:</label>
            <input type="email" name="Email" id="Email" placeholder="Enter your email address" title="Enter your email address" required><br><br>

            <label for="Number" id="phoneNumber">Phone Number:</label>
            <input type="tel" name="Number" id="Number" placeholder="Enter your phone number" title="Enter your phone number" required><br><br>

            <label for="gender_dropdown" id="gender">Gender:</label>
            <select name="gender_dropdown" id="gender_dropdown" title="Gender" required>
                <option value="" selected disabled>Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                
            </select>
            <br><br>
              
            <label name="address" id="address">Address:</label>
            <input type="text" name="address" id="address" placeholder="Enter your address" required><br><br>

            <button type="submit" id="name_button" name="name_button">Submit</button>
        </fieldset>

        </form>
        
    </body>
</html>
