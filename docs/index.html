<!DOCTYPE html>
<html>
    <head lang="en">
        <!--Developed By H.P.G.I.Dhananjaya for GitHub WebDev Crew-->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="CSSFiles/loginPage.css">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Agu+Display&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Momo+Signature&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Pacifico&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
        </style>
        <title>Log in</title>
    </head>
    <body>
        <div id="sectionContainer">
            <div id="pictureWindow">
                <div id="title">Student Portal</div>
                <div id="logoContainer"><input type="image" src="PicturesFolder/logo.webp" alt="logo.webp" id="logo" width="60px" height="80px">FOS Dipartment of Computer Science</div>
            </div>
            <div id="loginWindow">
                <p>Welcome <span id="h2"><br>Please Login to your Account.</span> </p>
                <hr>
                <br>
                <label id="userNameLabel" class="inputLabels">User Name  </label><br>
                <input type="text" id="userName" placeholder="Enter User Name" class="inputs"><br><br>

                <label id="passwordLabel" class="inputLabels">Password  </label><br>
                <input type="password" id="password" placeholder="Enter Password" class="inputs"><br><br>

                <button type="button" id="loginButton">Login</button><br><br>
                <button type="button" id="resetButton">Reset</button><br><br>
                <div id="copyRight">&copy; 2026 GitHub WebDev Crew, All Rights Reserved.</div>
            </div>
            
        </div>
        <script src="JSFiles/loginPage.js"></script>
    </body>
</html>
